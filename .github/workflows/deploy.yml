name: Deploy to SiteGround

# Uploads public/ to the SiteGround site over SFTP whenever main changes.
#
# Repository secrets it needs (Settings > Secrets and variables > Actions):
#   SFTP_KEY             the private key, whole text
#   SFTP_KEY_PASSPHRASE  the key's password (leave unset if the key has none)
#
# The host, port, username and host fingerprint below are the same Multisite SFTP
# login the gym-sites repository uses.
#
# Optional repository variable:
#   SFTP_REMOTE_DIR      the site's public_html, if it is not found automatically

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteground-deploy
  cancel-in-progress: false

env:
  SITE_DOMAIN: johnw860.sg-host.com
  SFTP_HOST: sftp.siteground.net
  SFTP_PORT: "18765"
  SFTP_USER: sftp6234-d725e521
  # The job stops if the server presents a key with any other fingerprint.
  SFTP_HOST_FINGERPRINT: SHA256:PvEri3iYKZeVBGSPE54fg2bDTfYxGpHqnRc+nOZMj/Q

jobs:
  deploy:
    name: Upload the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Upload public/ over SFTP
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_KEY_PASSPHRASE: ${{ secrets.SFTP_KEY_PASSPHRASE }}
          REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}
        run: bash scripts/deploy-sftp.sh

      - name: Check the live page
        run: |
          url="http://${SITE_DOMAIN}/"
          for attempt in 1 2 3 4; do
            body="$(curl -fsSL --max-time 20 "$url" || true)"
            if grep -q "Texas Land Law, PLLC" <<<"$body"; then
              echo "The new page is live at $url"
              echo "Live at <$url>" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::warning title=Uploaded, not visible yet::$url is not showing the new page. If it still is not there in a few minutes, clear the cache in SiteGround (Site Tools > Speed > Caching) and check that the domain points at this site."
